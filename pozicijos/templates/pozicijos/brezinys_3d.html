{% load static %}
<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <title>3D peržiūra – {{ brezinys.pavadinimas|default:brezinys.filename }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    html, body { height: 100%; margin: 0; background: #0b1220; color: #e5e7eb; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Arial, sans-serif; }

    .topbar {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: #111827;
      border-bottom: 1px solid rgba(255,255,255,.08);
      box-sizing: border-box;
      gap: 12px;
    }
    .topbar .left, .topbar .right { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .topbar .title { min-width: 0; text-align: center; flex: 1; }
    .topbar .title .main { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar .title .sub  { font-size: 12px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .ui-btn, .ui-link {
      color: #93c5fd;
      text-decoration: none;
      font-size: 13px;
      border: 1px solid rgba(147,197,253,.35);
      padding: 6px 10px;
      border-radius: 6px;
      white-space: nowrap;
      background: transparent;
      cursor: pointer;
      user-select: none;
    }
    .ui-btn:hover, .ui-link:hover { background: rgba(147,197,253,.08); }
    .ui-btn.is-on {
      background: rgba(147,197,253,.10);
      border-color: rgba(147,197,253,.60);
    }
    .ui-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    #viewer { height: calc(100vh - 52px); width: 100%; }

    #status {
      position: fixed;
      left: 12px;
      bottom: 12px;
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.14);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      max-width: min(820px, calc(100vw - 24px));
      display: none;
      white-space: pre-wrap;
      z-index: 9999;
    }

    #measureOverlay {
      position: fixed;
      left: 0;
      top: 52px;
      width: 100vw;
      height: calc(100vh - 52px);
      pointer-events: none;
      display: none;
      z-index: 9000;
    }
    #measureSvg {
      position:absolute;
      left:0; top:0;
      width:100%;
      height:100%;
    }
    .mpt {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: rgba(147,197,253,.90);
      border: 2px solid rgba(255,255,255,.80);
      box-shadow: 0 0 0 2px rgba(0,0,0,.25);
      transform: translate(-9999px, -9999px);
    }
    .mpt.preview {
      width: 12px;
      height: 12px;
      background: rgba(253, 224, 71, .95);
      border-color: rgba(255,255,255,.90);
    }
    .mlabel {
      position:absolute;
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 999px;
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.18);
      color: #e5e7eb;
      transform: translate(-9999px, -9999px);
      white-space: nowrap;
    }

    /* Ploto (trikampių) vizualizacija */
    .tri-poly {
      fill: rgba(34,197,94,.20);
      stroke: rgba(34,197,94,.85);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }
    .tri-poly.last {
      fill: rgba(249,115,22,.22);
      stroke: rgba(249,115,22,.95);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    #backHint {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      box-sizing: border-box;
    }
    #backHint .panel {
      width: min(620px, 100%);
      background: #0b1220;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 12px;
      padding: 14px 14px;
      box-shadow: 0 12px 40px rgba(0,0,0,.45);
    }
    #backHint .panel h3 { margin: 0 0 8px 0; font-size: 14px; }
    #backHint .panel p {
      margin: 0 0 10px 0;
      font-size: 13px;
      opacity: .9;
      line-height: 1.35;
      white-space: pre-wrap;
    }
    #backHint .panel .actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 10px;
    }
  </style>

  <script src="{% static 'pozicijos/js/o3dv.min.js' %}"></script>
  <script>
    const STEP_MODEL_URL = "{{ brezinys.failas.url|escapejs }}";
    const BACK_URL = "{% url 'pozicijos:detail' pozicija.id %}";

    const MEASURE_SCALE = 1.0;
    const MEASURE_UNIT  = "mm";

    const SNAP_VERTEX_PX = 14;
    const SNAP_EDGE_PX   = 10;

    // overlay limit (kad neužmuštų)
    const MAX_TRI_OVERLAY = 350;

    // „Paviršius“ region grow kampas (laipsniais)
    const REGION_ANGLE_DEG = 15;

    function setStatus(msg, show = true) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.style.display = show ? 'block' : 'none';
    }

    function fmt(n, d=3) {
      if (typeof n !== 'number' || !isFinite(n)) return String(n);
      return n.toFixed(d);
    }

    function isThreeCamera(obj) {
      if (!obj) return false;
      return !!(obj.projectionMatrix && obj.matrixWorldInverse) || !!(obj.isCamera || obj.isPerspectiveCamera || obj.isOrthographicCamera);
    }

    function dist2d(a, b) {
      const dx = a.x - b.x, dy = a.y - b.y;
      return Math.sqrt(dx*dx + dy*dy);
    }

    function showBackHint(text) {
      const wrap = document.getElementById('backHint');
      const msg = document.getElementById('backHintMsg');
      msg.textContent = text;
      wrap.style.display = 'flex';
    }

    function hideBackHint() {
      document.getElementById('backHint').style.display = 'none';
    }

    function smartBack() {
      try {
        if (window.top && window.top !== window.self) {
          window.top.location.href = BACK_URL;
          return;
        }
      } catch (e) {}

      try {
        if (window.opener && !window.opener.closed) {
          try { window.opener.location.href = BACK_URL; } catch (e) {}
          try { window.opener.focus(); } catch (e) {}
          try { window.close(); } catch (e) {}
          setTimeout(() => {
            showBackHint(
              "Ši 3D peržiūra buvo atidaryta atskirame tab'e.\n" +
              "Naršyklė neleido automatiškai uždaryti tab'o.\n\n" +
              "Uždarykite šį tab'ą (Cmd+W / Ctrl+W), o pozicijos kortelė yra originaliame tab'e."
            );
          }, 120);
          return;
        }
      } catch (e) {}

      if (window.history && window.history.length > 1) {
        window.history.back();
        return;
      }

      showBackHint(
        "Šis tab'as atidarytas be ryšio su pradiniu (window.opener nėra).\n" +
        "Jei atidarote 3D peržiūrą su target=\"_blank\" ir rel=\"noopener\", naršyklė atjungia pradinį tab'ą.\n\n" +
        "Sprendimas: atidarykite 3D tame pačiame tab'e (be target=_blank) arba atidarykite naują tab'ą be noopener.\n" +
        "Dabar – tiesiog uždarykite šį 3D tab'ą (Cmd+W / Ctrl+W)."
      );
    }

    window.addEventListener('load', () => {
      const backBtn = document.getElementById('btnBack');
      if (backBtn) backBtn.addEventListener('click', smartBack);
      const backHintClose = document.getElementById('backHintClose');
      if (backHintClose) backHintClose.addEventListener('click', hideBackHint);

      const OVNS = window.OV || (typeof OV !== 'undefined' ? OV : null);
      if (!OVNS) { setStatus("O3DV nepasiekiamas: nerastas global OV."); return; }
      if (!OVNS.EmbeddedViewer) { setStatus("O3DV įkeltas, bet nerastas OV.EmbeddedViewer."); return; }
      if (!STEP_MODEL_URL) { setStatus("Tuščias STEP_MODEL_URL (brezinys.failas.url)."); return; }

      const host = document.getElementById('viewer');
      const overlay = document.getElementById('measureOverlay');
      const pprev = document.getElementById('mprev');
      const p1el = document.getElementById('mpt1');
      const p2el = document.getElementById('mpt2');
      const line = document.getElementById('mline');
      const label = document.getElementById('mlabel');
      const triLayer = document.getElementById('trianglesLayer');

      const btnAreaAll = document.getElementById('btnAreaAll');
      const btnAreaRegion = document.getElementById('btnAreaRegion');

      let embedded = null;
      let innerViewer = null;
      let navigation = null;
      let isLoaded = false;

      let measureOn = false;
      let areaOn = false;

      // area režimo tipas: 'single' arba 'region'
      let areaMode = "single";

      let P1v = null, P2v = null;
      let P1snap = null, P2snap = null;
      let S1f = null, S2f = null;

      let preview = null;

      // V2 area state
      // areaSelectionByKey: key -> { areaRaw, centroid, vA, vB, vC }
      let areaSelectionByKey = new Map();
      let areaTotalRaw = 0;
      let areaLast = null; // { key, areaRaw, pt, centroid, snap, action:'+'|'-' }

      // Region cache per object geometry (adjacency, normals)
      // WeakMap<object, { adj: Map<faceIndex, number[]>, nrm: Map<faceIndex, Vector3>, tri: Map<faceIndex, {a,b,c, vA,vB,vC, area, centroid}> }>
      let regionCache = new WeakMap();

      let rafId = null;
      let moveRaf = null;
      let lastMove = null;

      function showOverlay(on) { overlay.style.display = on ? 'block' : 'none'; }

      function setMarker(el, s) {
        if (!s || !s.visible) {
          el.style.transform = 'translate(-9999px, -9999px)';
          return;
        }
        const sz = el.classList.contains('preview') ? 6 : 5;
        el.style.transform = `translate(${s.x}px, ${s.y}px) translate(-${sz}px, -${sz}px)`;
      }

      function setLine(a, b) {
        if (!a || !b || !a.visible || !b.visible) {
          line.setAttribute('x1', '-9999'); line.setAttribute('y1', '-9999');
          line.setAttribute('x2', '-9999'); line.setAttribute('y2', '-9999');
          return;
        }
        line.setAttribute('x1', String(a.x));
        line.setAttribute('y1', String(a.y));
        line.setAttribute('x2', String(b.x));
        line.setAttribute('y2', String(b.y));
      }

      function setLabel(s, text) {
        if (!s || !s.visible || !text) {
          label.style.transform = 'translate(-9999px, -9999px)';
          label.textContent = '';
          return;
        }
        label.textContent = text;
        label.style.transform = `translate(${s.x}px, ${s.y}px) translate(-50%, -120%)`;
      }

      function hidePreview() {
        preview = null;
        setMarker(pprev, null);
      }

      function areaCount() { return areaSelectionByKey.size; }

      function areaTotalScaled() {
        return areaTotalRaw * MEASURE_SCALE * MEASURE_SCALE;
      }

      function updateButtons() {
        const enable = !!areaOn;
        if (btnAreaAll) btnAreaAll.disabled = !enable;
        if (btnAreaRegion) btnAreaRegion.disabled = !enable;

        if (btnAreaRegion) btnAreaRegion.classList.toggle('is-on', enable && areaMode === "region");
      }

      function areaStatusText(prefix) {
        const totalScaled = areaTotalScaled();
        const count = areaCount();

        if (!areaLast) {
          return (prefix ? prefix + "\n" : "") +
            "Plotas:\n" +
            `Režimas: ${areaMode === "region" ? "Paviršius (auto)" : "Rankinis (1 trik.)"}\n` +
            `Pažymėta trikampių: ${count}\n` +
            `Bendra suma: ${fmt(totalScaled, 2)} ${MEASURE_UNIT}²\n\n` +
            "Spausk ant paviršiaus:\n" +
            "  • 1 kartą – pridėti\n" +
            "  • 2 kartą ant to paties – nuimti (toggle)\n\n" +
            "„Paviršius“: surenka gretimą regioną (kampas " + REGION_ANGLE_DEG + "°).\n" +
            "„Visas plotas“: suskaičiuoja visą detalę.\n" +
            "\"Išvalyti\" – nuvalyti sumą. ESC – išjungti.";
        }

        const lastScaled = areaLast.areaRaw * MEASURE_SCALE * MEASURE_SCALE;
        const act = (areaLast.action === '-') ? "NUIMTA" : "PRIDĖTA";

        return (prefix ? prefix + "\n" : "") +
          "Plotas:\n" +
          `Režimas: ${areaMode === "region" ? "Paviršius (auto)" : "Rankinis (1 trik.)"}\n` +
          `Paskutinis (${act}): ${fmt(lastScaled, 2)} ${MEASURE_UNIT}²\n` +
          `Pažymėta trikampių: ${count}\n` +
          `Bendra suma: ${fmt(totalScaled, 2)} ${MEASURE_UNIT}²\n` +
          `P[${areaLast.snap}]: X=${fmt(areaLast.pt.x)} Y=${fmt(areaLast.pt.y)} Z=${fmt(areaLast.pt.z)}\n\n` +
          "„Paviršius“: surenka gretimą regioną (kampas " + REGION_ANGLE_DEG + "°).\n" +
          "„Visas plotas“: suskaičiuoja visą detalę.\n" +
          "\"Išvalyti\" – nuvalyti sumą. ESC – išjungti.";
      }

      function clearMeasure(keepMode=false) {
        P1v = null; P2v = null;
        P1snap = null; P2snap = null;
        S1f = null; S2f = null;
        preview = null;

        setMarker(pprev, null);
        setMarker(p1el, null);
        setMarker(p2el, null);
        setLine(null, null);
        setLabel(null, "");

        if (keepMode && measureOn) {
          setStatus(
            "Matavimas: spausk 1 tašką ant modelio, tada 2 tašką.\n" +
            "Auto-snap: Vertex > Edge > Free.\n" +
            "ESC – išjungti. \"Išvalyti\" – nuvalyti."
          );
        } else if (!measureOn && !areaOn) {
          setStatus("", false);
        }
      }

      function clearArea(keepMode=false) {
        areaSelectionByKey.clear();
        areaTotalRaw = 0;
        areaLast = null;

        if (triLayer) triLayer.innerHTML = "";

        preview = null;
        P1v = null; P2v = null;
        P1snap = null; P2snap = null;
        S1f = null; S2f = null;

        setMarker(pprev, null);
        setMarker(p1el, null);
        setMarker(p2el, null);
        setLine(null, null);
        setLabel(null, "");

        if (keepMode && areaOn) {
          setStatus(areaStatusText());
        } else if (!measureOn && !areaOn) {
          setStatus("", false);
        }
      }

      function setMeasureMode(on) {
        measureOn = on;
        if (measureOn && areaOn) {
          areaOn = false;
          clearArea(false);
        }

        document.getElementById('btnMeasure').classList.toggle('is-on', measureOn);
        document.getElementById('btnArea').classList.toggle('is-on', areaOn);
        updateButtons();

        if (measureOn || areaOn) {
          showOverlay(true);
          if (measureOn) clearMeasure(true);
          startTick();
        } else {
          showOverlay(false);
          clearMeasure(false);
          clearArea(false);
          stopTick();
        }
      }

      function setAreaMode(on) {
        areaOn = on;
        if (areaOn && measureOn) {
          measureOn = false;
          clearMeasure(false);
        }

        document.getElementById('btnMeasure').classList.toggle('is-on', measureOn);
        document.getElementById('btnArea').classList.toggle('is-on', areaOn);
        updateButtons();

        if (measureOn || areaOn) {
          showOverlay(true);
          if (areaOn) setStatus(areaStatusText());
          startTick();
        } else {
          showOverlay(false);
          clearMeasure(false);
          clearArea(false);
          stopTick();
        }
      }

      function getThreeCam() {
        if (!innerViewer) return null;
        const cands = [];
        try { if (typeof innerViewer.GetCamera === "function") cands.push(innerViewer.GetCamera()); } catch (e) {}
        cands.push(innerViewer.camera);
        cands.push(innerViewer.renderer && innerViewer.renderer.camera);
        cands.push(innerViewer.renderer && innerViewer.renderer.threeCamera);

        for (const c of cands) {
          if (!c) continue;
          if (isThreeCamera(c)) return c;
          if (c.camera && isThreeCamera(c.camera)) return c.camera;
          if (c.threeCamera && isThreeCamera(c.threeCamera)) return c.threeCamera;
          try {
            if (typeof c.GetThreeCamera === "function") {
              const tc = c.GetThreeCamera();
              if (isThreeCamera(tc)) return tc;
            }
          } catch (e) {}
        }
        return null;
      }

      function projectToOverlay(vec3, cam) {
        if (!vec3 || !cam) return null;
        const w = overlay.clientWidth;
        const h = overlay.clientHeight;
        if (!w || !h) return null;
        if (typeof vec3.clone !== "function" || typeof vec3.project !== "function") return null;

        const v = vec3.clone().project(cam);
        const x = (v.x * 0.5 + 0.5) * w;
        const y = (-v.y * 0.5 + 0.5) * h;

        const visible =
          isFinite(x) && isFinite(y) &&
          x >= -100 && x <= (w + 100) &&
          y >= -100 && y <= (h + 100);

        return { x, y, visible };
      }

      function updateTrianglesOverlay(cam) {
        if (!triLayer) return;

        if (!areaOn) {
          if (triLayer.innerHTML) triLayer.innerHTML = "";
          return;
        }

        if (areaSelectionByKey.size === 0) {
          if (triLayer.innerHTML) triLayer.innerHTML = "";
          return;
        }

        let i = 0;
        let html = "";

        for (const [key, rec] of areaSelectionByKey.entries()) {
          i += 1;
          if (i > MAX_TRI_OVERLAY) break;

          const a = projectToOverlay(rec.vA, cam);
          const b = projectToOverlay(rec.vB, cam);
          const c = projectToOverlay(rec.vC, cam);

          if (!a || !b || !c || !a.visible || !b.visible || !c.visible) continue;

          const pts = `${a.x},${a.y} ${b.x},${b.y} ${c.x},${c.y}`;
          const cls = (areaLast && areaLast.key === key) ? "tri-poly last" : "tri-poly";
          html += `<polygon class="${cls}" points="${pts}"></polygon>`;
        }

        triLayer.innerHTML = html;
      }

      function updateOverlay() {
        if (!measureOn && !areaOn) return;

        const cam = getThreeCam();
        if (cam) updateTrianglesOverlay(cam);

        const s1 = (cam && P1v) ? projectToOverlay(P1v, cam) : S1f;
        const s2 = (cam && P2v) ? projectToOverlay(P2v, cam) : S2f;

        setMarker(p1el, s1);
        setMarker(p2el, s2);

        if (measureOn) setLine(s1, s2);
        else setLine(null, null);

        if (preview && (areaOn || !P1v || !P2v)) setMarker(pprev, preview.s);
        else setMarker(pprev, null);

        if (measureOn && P1v && P2v) {
          const raw = (typeof P1v.distanceTo === "function") ? P1v.distanceTo(P2v) : null;
          const d = (raw !== null) ? (raw * MEASURE_SCALE) : null;
          if (s1 && s2 && s1.visible && s2.visible && d !== null) {
            const mid = { x: (s1.x + s2.x)/2, y: (s1.y + s2.y)/2, visible: true };
            setLabel(mid, `${fmt(d, 2)} ${MEASURE_UNIT}`);
          } else {
            setLabel(null, "");
          }
          return;
        }

        if (areaOn && areaLast && areaLast.centroid) {
          const ls = cam ? projectToOverlay(areaLast.centroid, cam) : null;
          const totalScaled = areaTotalScaled();
          const count = areaCount();
          if (ls && ls.visible) {
            setLabel(ls, `Σ ${fmt(totalScaled, 2)} ${MEASURE_UNIT}² (${count})`);
          } else {
            setLabel(null, "");
          }
          return;
        }

        setLabel(null, "");
      }

      function tick() {
        if (!measureOn && !areaOn) { rafId = null; return; }
        updateOverlay();
        rafId = requestAnimationFrame(tick);
      }

      function startTick() {
        if (rafId !== null) return;
        rafId = requestAnimationFrame(tick);
      }

      function stopTick() {
        if (rafId === null) return;
        cancelAnimationFrame(rafId);
        rafId = null;
      }

      function normalizeIntersection(rawHit) {
        if (!rawHit) return null;
        let cand = rawHit.intersection || rawHit.hit || rawHit.result || rawHit;
        if (!cand || !cand.point) return null;

        if (cand === rawHit.intersection) {
          const merged = Object.assign({}, cand);
          if (!merged.object && rawHit.object) merged.object = rawHit.object;
          if (!merged.face && rawHit.face) merged.face = rawHit.face;
          if (typeof merged.faceIndex !== 'number' && typeof rawHit.faceIndex === 'number') merged.faceIndex = rawHit.faceIndex;
          if (!merged.point && rawHit.point) merged.point = rawHit.point;
          return merged;
        }
        return cand;
      }

      function getVector3CtorFrom(inter) {
        if (inter && inter.point && inter.point.constructor) return inter.point.constructor;
        const cam = getThreeCam();
        if (cam && cam.position && cam.position.constructor) return cam.position.constructor;
        return null;
      }

      function getTriangleWorldVerts(inter) {
        if (!inter || !inter.object || !inter.object.geometry) return null;

        const obj = inter.object;
        const geom = obj.geometry;
        const posAttr = geom.attributes && geom.attributes.position;
        if (!posAttr) return null;

        const Vector3 = getVector3CtorFrom(inter);
        if (typeof Vector3 !== 'function') return null;

        let ia = null, ib = null, ic = null;

        if (inter.face && typeof inter.face.a === 'number') {
          ia = inter.face.a; ib = inter.face.b; ic = inter.face.c;
        } else if (typeof inter.faceIndex === 'number') {
          if (geom.index && geom.index.array) {
            const idx = geom.index.array;
            const i = inter.faceIndex * 3;
            ia = idx[i]; ib = idx[i+1]; ic = idx[i+2];
          } else {
            const i = inter.faceIndex * 3;
            ia = i; ib = i+1; ic = i+2;
          }
        } else {
          return null;
        }

        try {
          const vA = new Vector3().fromBufferAttribute(posAttr, ia).applyMatrix4(obj.matrixWorld);
          const vB = new Vector3().fromBufferAttribute(posAttr, ib).applyMatrix4(obj.matrixWorld);
          const vC = new Vector3().fromBufferAttribute(posAttr, ic).applyMatrix4(obj.matrixWorld);
          return { vA, vB, vC, ia, ib, ic };
        } catch (e) {
          return null;
        }
      }

      function closestPointOnSegment(p, a, b) {
        if (!p || !a || !b || typeof p.clone !== 'function') return null;
        const ab = b.clone().sub(a);
        const ap = p.clone().sub(a);
        const denom = (typeof ab.lengthSq === 'function') ? ab.lengthSq() : null;
        if (!denom || denom <= 1e-12) return a.clone();

        let t = ap.dot(ab) / denom;
        t = Math.max(0, Math.min(1, t));
        return a.clone().add(ab.multiplyScalar(t));
      }

      function computeSnap(interRaw, mouseCoords) {
        const inter = normalizeIntersection(interRaw);
        if (!inter || !inter.point) return null;

        const cam = getThreeCam();
        const mouse = { x: mouseCoords.x, y: mouseCoords.y };

        if (!cam) {
          const pt = (typeof inter.point.clone === 'function') ? inter.point.clone() : inter.point;
          return { pt, snap: 'F', screenFallback: { x: mouse.x, y: mouse.y, visible: true } };
        }

        const tri = getTriangleWorldVerts(inter);
        if (!tri) {
          const pt = (typeof inter.point.clone === 'function') ? inter.point.clone() : inter.point;
          const s = projectToOverlay(pt, cam);
          return { pt, snap: 'F', screen: s, screenFallback: { x: mouse.x, y: mouse.y, visible: true } };
        }

        const vList = [tri.vA, tri.vB, tri.vC];
        let bestV = null;

        for (const v of vList) {
          const s = projectToOverlay(v, cam);
          if (!s) continue;
          const d = dist2d(s, mouse);
          if (!bestV || d < bestV.d) bestV = { v, s, d };
        }

        if (bestV && bestV.d <= SNAP_VERTEX_PX) {
          return { pt: bestV.v.clone(), snap: 'V', screen: bestV.s, screenFallback: { x: mouse.x, y: mouse.y, visible: true } };
        }

        const p = (typeof inter.point.clone === 'function') ? inter.point.clone() : inter.point;
        const edges = [
          { a: tri.vA, b: tri.vB },
          { a: tri.vB, b: tri.vC },
          { a: tri.vC, b: tri.vA },
        ];

        let bestE = null;
        for (const e of edges) {
          const cp = closestPointOnSegment(p, e.a, e.b);
          if (!cp) continue;
          const s = projectToOverlay(cp, cam);
          if (!s) continue;
          const d = dist2d(s, mouse);
          if (!bestE || d < bestE.d) bestE = { cp, s, d };
        }

        if (bestE && bestE.d <= SNAP_EDGE_PX) {
          return { pt: bestE.cp.clone(), snap: 'E', screen: bestE.s, screenFallback: { x: mouse.x, y: mouse.y, visible: true } };
        }

        const pt = (typeof inter.point.clone === 'function') ? inter.point.clone() : inter.point;
        const s = projectToOverlay(pt, cam);
        return { pt, snap: 'F', screen: s, screenFallback: { x: mouse.x, y: mouse.y, visible: true } };
      }

      function triangleArea3D(vA, vB, vC) {
        if (!vA || !vB || !vC || typeof vA.clone !== 'function') return null;
        try {
          const ab = vB.clone().sub(vA);
          const ac = vC.clone().sub(vA);
          const cross = ab.cross(ac);
          const raw = (typeof cross.length === 'function') ? cross.length() : null;
          if (raw === null || !isFinite(raw)) return null;
          return 0.5 * raw;
        } catch (e) {
          return null;
        }
      }

      function triangleCentroid(vA, vB, vC) {
        if (!vA || !vB || !vC || typeof vA.clone !== 'function') return null;
        try { return vA.clone().add(vB).add(vC).multiplyScalar(1/3); }
        catch (e) { return null; }
      }

      function triangleNormal(vA, vB, vC) {
        if (!vA || !vB || !vC || typeof vA.clone !== 'function') return null;
        try {
          const ab = vB.clone().sub(vA);
          const ac = vC.clone().sub(vA);
          const n = ab.cross(ac);
          const len = (typeof n.length === "function") ? n.length() : null;
          if (!len || !isFinite(len) || len < 1e-12) return null;
          return n.multiplyScalar(1/len);
        } catch (e) {
          return null;
        }
      }

      function getObjectStableId(obj) {
        if (!obj) return "obj:unknown";
        if (typeof obj.id !== 'undefined') return `objid:${obj.id}`;
        if (typeof obj.uuid === 'string') return `uuid:${obj.uuid}`;
        if (!obj.__areaPickLocalId) {
          obj.__areaPickLocalId = `local:${Math.random().toString(36).slice(2, 10)}`;
        }
        return obj.__areaPickLocalId;
      }

      function getAreaFaceKey(inter) {
        const n = normalizeIntersection(inter);
        if (!n || !n.object) return null;

        let faceIndex = (typeof n.faceIndex === 'number') ? n.faceIndex : null;

        if (faceIndex === null && n.face && typeof n.face.a === 'number' && typeof n.face.b === 'number' && typeof n.face.c === 'number') {
          const oid = getObjectStableId(n.object);
          return `${oid}|faceabc:${n.face.a},${n.face.b},${n.face.c}`;
        }

        if (faceIndex === null) return null;

        const oid = getObjectStableId(n.object);
        return `${oid}|fi:${faceIndex}`;
      }

      function onHostMouseMove(ev) {
        if (!measureOn && !areaOn) return;
        if (!isLoaded || !innerViewer) return;
        if (measureOn && P1v && P2v) return;

        const rect = overlay.getBoundingClientRect();
        const x = ev.clientX - rect.left;
        const y = ev.clientY - rect.top;

        if (!isFinite(x) || !isFinite(y) || x < 0 || y < 0 || x > rect.width || y > rect.height) {
          hidePreview();
          return;
        }

        lastMove = { x, y };
        if (moveRaf) return;

        moveRaf = requestAnimationFrame(() => {
          moveRaf = null;
          if (!lastMove || (!measureOn && !areaOn)) return;

          let hit = null;
          try {
            hit = innerViewer.GetMeshIntersectionUnderMouse(OVNS.IntersectionMode.MeshAndLine, lastMove);
          } catch (e) {
            hidePreview();
            return;
          }

          if (!hit || !hit.point) {
            hidePreview();
            return;
          }

          const snap = computeSnap(hit, lastMove);
          if (!snap) {
            hidePreview();
            return;
          }

          const s = snap.screen || snap.screenFallback;
          preview = { snap: snap.snap, s };
          updateOverlay();
        });
      }

      function ensureRegionCacheForObject(obj, anyHit) {
        if (!obj || !obj.geometry) return null;
        if (regionCache.has(obj)) return regionCache.get(obj);

        const geom = obj.geometry;
        const posAttr = geom.attributes && geom.attributes.position;
        if (!posAttr) return null;

        const Vector3 = getVector3CtorFrom(anyHit);
        if (typeof Vector3 !== "function") return null;

        // Build faces list (faceIndex -> vertex indices)
        let indices = null;
        if (geom.index && geom.index.array) indices = geom.index.array;

        const faceCount = indices ? (indices.length / 3) : (posAttr.count / 3);
        const tri = new Map();
        const adj = new Map();
        const nrm = new Map();

        // Edge map: "min|max" -> [faceIndex,...]
        const edgeMap = new Map();

        function addEdge(a, b, fi) {
          const mn = a < b ? a : b;
          const mx = a < b ? b : a;
          const key = mn + "|" + mx;
          let arr = edgeMap.get(key);
          if (!arr) { arr = []; edgeMap.set(key, arr); }
          arr.push(fi);
        }

        for (let fi = 0; fi < faceCount; fi++) {
          let ia, ib, ic;
          if (indices) {
            const i = fi * 3;
            ia = indices[i]; ib = indices[i+1]; ic = indices[i+2];
          } else {
            ia = fi * 3; ib = fi * 3 + 1; ic = fi * 3 + 2;
          }

          // world verts
          const vA = new Vector3().fromBufferAttribute(posAttr, ia).applyMatrix4(obj.matrixWorld);
          const vB = new Vector3().fromBufferAttribute(posAttr, ib).applyMatrix4(obj.matrixWorld);
          const vC = new Vector3().fromBufferAttribute(posAttr, ic).applyMatrix4(obj.matrixWorld);

          const areaRaw = triangleArea3D(vA, vB, vC) || 0;
          const centroid = triangleCentroid(vA, vB, vC) || vA;

          tri.set(fi, { ia, ib, ic, vA, vB, vC, areaRaw, centroid });

          const nn = triangleNormal(vA, vB, vC);
          if (nn) nrm.set(fi, nn);

          addEdge(ia, ib, fi);
          addEdge(ib, ic, fi);
          addEdge(ic, ia, fi);
        }

        // adjacency build
        for (const faces of edgeMap.values()) {
          if (!faces || faces.length < 2) continue;
          for (let i = 0; i < faces.length; i++) {
            for (let j = 0; j < faces.length; j++) {
              if (i === j) continue;
              const aFi = faces[i], bFi = faces[j];
              let list = adj.get(aFi);
              if (!list) { list = []; adj.set(aFi, list); }
              list.push(bFi);
            }
          }
        }

        // dedupe adjacency arrays
        for (const [k, list] of adj.entries()) {
          const s = new Set(list);
          adj.set(k, Array.from(s));
        }

        const cache = { tri, adj, nrm };
        regionCache.set(obj, cache);
        return cache;
      }

      function collectRegionFaces(obj, startFaceIndex, anyHit) {
        const cache = ensureRegionCacheForObject(obj, anyHit);
        if (!cache) return null;

        const { adj, nrm } = cache;

        const startN = nrm.get(startFaceIndex);
        if (!startN) return [startFaceIndex];

        const cosThr = Math.cos((REGION_ANGLE_DEG * Math.PI) / 180);

        const visited = new Set();
        const stack = [startFaceIndex];
        visited.add(startFaceIndex);

        let safety = 0;

        while (stack.length) {
          const fi = stack.pop();
          const neigh = adj.get(fi) || [];
          for (const nb of neigh) {
            if (visited.has(nb)) continue;
            const nn = nrm.get(nb);
            if (!nn) continue;

            // dot product threshold
            const dot = startN.x*nn.x + startN.y*nn.y + startN.z*nn.z;
            if (dot >= cosThr) {
              visited.add(nb);
              stack.push(nb);
            }
          }
          safety += 1;
          if (safety > 200000) break; // hard stop
        }

        return Array.from(visited);
      }

      function applyRegionToggle(nHit, pt, st) {
        const obj = nHit.object;
        const geom = obj && obj.geometry;
        if (!obj || !geom) {
          setStatus("Paviršius: nerastas mesh objektas.");
          return;
        }

        const startFi = (typeof nHit.faceIndex === "number") ? nHit.faceIndex : null;
        if (startFi === null) {
          setStatus("Paviršius: nerastas faceIndex.");
          return;
        }

        const oid = getObjectStableId(obj);
        const startKey = `${oid}|fi:${startFi}`;
        const startSelected = areaSelectionByKey.has(startKey);

        setStatus("Paviršius: skaičiuoju regioną…");

        // region collect
        const faces = collectRegionFaces(obj, startFi, nHit) || [startFi];

        const cache = ensureRegionCacheForObject(obj, nHit);
        if (!cache) {
          setStatus("Paviršius: nepavyko suformuoti regiono (cache).");
          return;
        }

        let deltaArea = 0;
        let changed = 0;

        if (startSelected) {
          // REMOVE region faces that are currently selected
          for (const fi of faces) {
            const key = `${oid}|fi:${fi}`;
            const rec = areaSelectionByKey.get(key);
            if (!rec) continue;
            deltaArea -= rec.areaRaw;
            areaSelectionByKey.delete(key);
            changed += 1;
          }
          areaLast = { key: startKey, areaRaw: (cache.tri.get(startFi)?.areaRaw || 0), pt, centroid: (cache.tri.get(startFi)?.centroid || pt), snap: st, action: '-' };
        } else {
          // ADD region faces that are not selected
          for (const fi of faces) {
            const key = `${oid}|fi:${fi}`;
            if (areaSelectionByKey.has(key)) continue;

            const t = cache.tri.get(fi);
            if (!t) continue;

            areaSelectionByKey.set(key, {
              areaRaw: t.areaRaw,
              centroid: t.centroid,
              vA: t.vA,
              vB: t.vB,
              vC: t.vC,
            });
            deltaArea += t.areaRaw;
            changed += 1;
          }
          areaLast = { key: startKey, areaRaw: (cache.tri.get(startFi)?.areaRaw || 0), pt, centroid: (cache.tri.get(startFi)?.centroid || pt), snap: st, action: '+' };
        }

        areaTotalRaw += deltaArea;

        setStatus(areaStatusText(`${startSelected ? "Paviršius nuimtas" : "Paviršius pridėtas"} (trik.: ${changed}).`));
      }

      function computeTotalMeshArea() {
        if (!innerViewer) return null;

        // Bandome pasiekti three.js sceną per galimus candidate'us
        const candScenes = [];
        try { candScenes.push(innerViewer.scene); } catch (e) {}
        try { candScenes.push(innerViewer.renderer && innerViewer.renderer.scene); } catch (e) {}
        try { candScenes.push(innerViewer.renderer && innerViewer.renderer.GetScene && innerViewer.renderer.GetScene()); } catch (e) {}
        try { candScenes.push(innerViewer.GetScene && innerViewer.GetScene()); } catch (e) {}

        const scene = candScenes.find(s => s && s.traverse);
        if (!scene) return null;

        const cam = getThreeCam(); // tik ctor užtikrinimui
        const Vector3 = (cam && cam.position && cam.position.constructor) ? cam.position.constructor : null;
        if (typeof Vector3 !== "function") return null;

        let total = 0;
        let triCount = 0;

        scene.traverse(obj => {
          if (!obj || !obj.isMesh) return;
          const geom = obj.geometry;
          if (!geom || !geom.attributes || !geom.attributes.position) return;

          const posAttr = geom.attributes.position;
          const idx = (geom.index && geom.index.array) ? geom.index.array : null;

          if (idx) {
            for (let i = 0; i < idx.length; i += 3) {
              const ia = idx[i], ib = idx[i+1], ic = idx[i+2];
              const vA = new Vector3().fromBufferAttribute(posAttr, ia).applyMatrix4(obj.matrixWorld);
              const vB = new Vector3().fromBufferAttribute(posAttr, ib).applyMatrix4(obj.matrixWorld);
              const vC = new Vector3().fromBufferAttribute(posAttr, ic).applyMatrix4(obj.matrixWorld);
              const a = triangleArea3D(vA, vB, vC);
              if (a) { total += a; triCount += 1; }
            }
          } else {
            for (let i = 0; i < posAttr.count; i += 3) {
              const vA = new Vector3().fromBufferAttribute(posAttr, i).applyMatrix4(obj.matrixWorld);
              const vB = new Vector3().fromBufferAttribute(posAttr, i+1).applyMatrix4(obj.matrixWorld);
              const vC = new Vector3().fromBufferAttribute(posAttr, i+2).applyMatrix4(obj.matrixWorld);
              const a = triangleArea3D(vA, vB, vC);
              if (a) { total += a; triCount += 1; }
            }
          }
        });

        return { totalRaw: total, triCount };
      }

      function onMeasureClick(button, mouseCoords) {
        if (!measureOn && !areaOn) return;
        if (button !== 1) return;

        if (!isLoaded || !innerViewer) {
          setStatus("Modelis dar kraunasi… palauk.");
          return;
        }

        let hit = null;
        try {
          hit = innerViewer.GetMeshIntersectionUnderMouse(OVNS.IntersectionMode.MeshAndLine, mouseCoords);
        } catch (e) {
          setStatus("Nepavyko atlikti picking (GetMeshIntersectionUnderMouse).\n" + (e && e.message ? e.message : String(e)));
          return;
        }

        if (!hit || !hit.point) {
          setStatus("Nepataikei ant modelio. Bandyk spustelėti ant geometrijos.");
          return;
        }

        const snap = computeSnap(hit, mouseCoords);
        const pt = (snap && snap.pt) ? snap.pt : (typeof hit.point.clone === "function" ? hit.point.clone() : hit.point);
        const st = (snap && snap.snap) ? snap.snap : 'F';
        const sc = (snap && (snap.screen || snap.screenFallback)) ? (snap.screen || snap.screenFallback) : { x: mouseCoords.x, y: mouseCoords.y, visible: true };

        if (areaOn) {
          const nHit = normalizeIntersection(hit);

          // AUTO region mode
          if (areaMode === "region") {
            P1v = pt; P1snap = st; S1f = sc;
            P2v = null; P2snap = null; S2f = null;
            hidePreview();
            updateOverlay();
            applyRegionToggle(nHit, pt, st);
            return;
          }

          // SINGLE triangle toggle
          const tri = getTriangleWorldVerts(nHit);
          if (!tri) {
            setStatus("Plotas: nepavyko nuskaityti pasirinkto trikampio geometrijos.");
            return;
          }

          const rawArea = triangleArea3D(tri.vA, tri.vB, tri.vC);
          if (rawArea === null) {
            setStatus("Plotas: nepavyko apskaičiuoti trikampio ploto.");
            return;
          }

          const key = getAreaFaceKey(nHit);
          if (!key) {
            setStatus("Plotas: nepavyko sudaryti unikalaus trikampio rakto (faceIndex).");
            return;
          }

          const centroid = triangleCentroid(tri.vA, tri.vB, tri.vC) || pt;

          const already = areaSelectionByKey.has(key);

          if (already) {
            const old = areaSelectionByKey.get(key);
            if (old && typeof old.areaRaw === "number") areaTotalRaw -= old.areaRaw;
            areaSelectionByKey.delete(key);
            areaLast = { key, areaRaw: rawArea, pt, centroid, snap: st, action: '-' };

            P1v = pt; P1snap = st; S1f = sc;
            P2v = null; P2snap = null; S2f = null;

            hidePreview();
            updateOverlay();
            setStatus(areaStatusText("Trikampis nuimtas."));
            return;
          }

          areaSelectionByKey.set(key, {
            areaRaw: rawArea,
            centroid: centroid,
            vA: tri.vA,
            vB: tri.vB,
            vC: tri.vC,
          });
          areaTotalRaw += rawArea;

          areaLast = { key, areaRaw: rawArea, pt, centroid, snap: st, action: '+' };

          P1v = pt; P1snap = st; S1f = sc;
          P2v = null; P2snap = null; S2f = null;

          hidePreview();
          updateOverlay();
          setStatus(areaStatusText("Trikampis pridėtas."));
          return;
        }

        // 2 taškų matavimas
        if (!P1v) {
          P1v = pt; P1snap = st; S1f = sc;
          hidePreview();
          updateOverlay();
          setStatus(
            "Matavimas: pasirinktas 1 taškas.\n" +
            `P1[${P1snap}]: X=${fmt(P1v.x)} Y=${fmt(P1v.y)} Z=${fmt(P1v.z)}\n` +
            "Dabar spausk 2 tašką."
          );
          return;
        }

        if (!P2v) {
          P2v = pt; P2snap = st; S2f = sc;
          hidePreview();
          updateOverlay();

          const raw = (typeof P1v.distanceTo === "function") ? P1v.distanceTo(P2v) : null;
          const d = (raw !== null) ? (raw * MEASURE_SCALE) : null;

          setStatus(
            "Matavimas: parinkti 2 taškai.\n" +
            (d !== null ? `Atstumas: ${fmt(d, 2)} ${MEASURE_UNIT}\n` : "") +
            `P1[${P1snap}]: X=${fmt(P1v.x)} Y=${fmt(P1v.y)} Z=${fmt(P1v.z)}\n` +
            `P2[${P2snap}]: X=${fmt(P2v.x)} Y=${fmt(P2v.y)} Z=${fmt(P2v.z)}\n\n` +
            "\"Išvalyti\" – naujam matavimui. ESC – išjungti matavimą."
          );
          return;
        }

        clearMeasure(true);
        P1v = pt; P1snap = st; S1f = sc;
        hidePreview();
        updateOverlay();
        setStatus(
          "Matavimas: pasirinktas 1 taškas.\n" +
          `P1[${P1snap}]: X=${fmt(P1v.x)} Y=${fmt(P1v.y)} Z=${fmt(P1v.z)}\n` +
          "Dabar spausk 2 tašką."
        );
      }

      try {
        embedded = new OVNS.EmbeddedViewer(host, {
          backgroundColor : new OVNS.RGBAColor(11, 18, 32, 255),
          defaultColor    : new OVNS.RGBColor(200, 200, 200),
          onModelLoaded: () => {
            isLoaded = true;
            if (measureOn) {
              setStatus(
                "Matavimas: spausk 1 tašką ant modelio, tada 2 tašką.\n" +
                "Auto-snap: Vertex > Edge > Free.\n" +
                "ESC – išjungti. \"Išvalyti\" – nuvalyti."
              );
            } else if (areaOn) {
              setStatus(areaStatusText());
            } else {
              setStatus("", false);
            }
          },
          onModelLoadFailed: () => {
            setStatus("Nepavyko užkrauti modelio.\nPatikrink /static/pozicijos/o3dv/ext/occt-import-js/ (worker/wasm) ir ar STEP failas pasiekiamas.");
          }
        });

        embedded.LoadModelFromUrlList([STEP_MODEL_URL]);

        innerViewer = embedded.GetViewer();
        navigation = innerViewer.navigation;

        const prevClick = navigation.onMouseClick;
        navigation.SetMouseClickHandler((button, mouseCoords) => {
          if (!measureOn && !areaOn) {
            if (typeof prevClick === "function") prevClick(button, mouseCoords);
            return;
          }
          onMeasureClick(button, mouseCoords);
        });

        host.addEventListener('mousemove', onHostMouseMove, { passive: true });
        host.addEventListener('mouseleave', () => { hidePreview(); }, { passive: true });

        window.addEventListener('resize', () => {
          try { embedded.Resize(); } catch (e) {}
          if (measureOn || areaOn) updateOverlay();
        });

        document.getElementById('btnMeasure').addEventListener('click', () => {
          setMeasureMode(!measureOn);
        });

        document.getElementById('btnArea').addEventListener('click', () => {
          setAreaMode(!areaOn);
        });

        document.getElementById('btnClear').addEventListener('click', () => {
          if (measureOn) clearMeasure(true);
          else if (areaOn) clearArea(true);
        });

        if (btnAreaRegion) {
          btnAreaRegion.addEventListener('click', () => {
            if (!areaOn) return;
            areaMode = (areaMode === "region") ? "single" : "region";
            updateButtons();
            setStatus(areaStatusText("Režimas pakeistas."));
          });
        }

        if (btnAreaAll) {
          btnAreaAll.addEventListener('click', () => {
            if (!areaOn) return;
            setStatus("Visas plotas: skaičiuoju…");
            // trumpas atidėjimas, kad UI spėtų persipiešti
            setTimeout(() => {
              const res = computeTotalMeshArea();
              if (!res) {
                setStatus("Visas plotas: nepavyko pasiekti scenos/mesh geometrijos (scene).");
                return;
              }
              const totalScaled = res.totalRaw * MEASURE_SCALE * MEASURE_SCALE;
              setStatus(
                "Visas plotas (trianguliuotas):\n" +
                `Trikampių: ${res.triCount}\n` +
                `Plotas: ${fmt(totalScaled, 2)} ${MEASURE_UNIT}²\n\n` +
                "Pastaba: tai mesh (trianguliacijos) plotas. Jei modelis turi vidinių paviršių – jie įeina."
              );
            }, 20);
          });
        }

        window.addEventListener('keydown', (ev) => {
          if (ev.key === 'Escape' && (measureOn || areaOn)) {
            if (measureOn) setMeasureMode(false);
            else setAreaMode(false);
          }
        });

        setMeasureMode(false);
        updateButtons();
      } catch (e) {
        setStatus("Klaida inicijuojant 3D peržiūrą:\n" + (e && e.message ? e.message : String(e)));
      }
    });
  </script>
</head>

<body>
  <div class="topbar">
    <div class="left">
      <button id="btnBack" class="ui-btn" type="button">Atgal</button>
    </div>

    <div class="title">
      <div class="main">{{ pozicija.poz_kodas }} – {{ pozicija.poz_pavad|default:"Be pavadinimo" }}</div>
      <div class="sub">{{ brezinys.pavadinimas|default:brezinys.filename }}</div>
    </div>

    <div class="right">
      <button id="btnClear" class="ui-btn" type="button" style="display:none;">Išvalyti</button>
      <button id="btnMeasure" class="ui-btn" type="button">Matuoti</button>

      <button id="btnArea" class="ui-btn" type="button">Plotas</button>
      <button id="btnAreaRegion" class="ui-btn" type="button" disabled>Paviršius</button>
      <button id="btnAreaAll" class="ui-btn" type="button" disabled>Visas plotas</button>
    </div>
  </div>

  <div id="viewer"></div>

  <div id="measureOverlay">
    <svg id="measureSvg" xmlns="http://www.w3.org/2000/svg">
      <g id="trianglesLayer"></g>
      <line id="mline" x1="-9999" y1="-9999" x2="-9999" y2="-9999"
            stroke="rgba(147,197,253,.95)" stroke-width="2" />
    </svg>
