{% extends "base.html" %}

{% block title %}Prisijungimas{% endblock %}

{% block content %}
<div style="max-width:420px;margin:48px auto;padding:24px;border:1px solid #e5e7eb;border-radius:12px;background:#fff;">
  <h1 style="margin-top:0;">Prisijungimas</h1>

  {% if form.errors %}
    <p style="color:#b91c1c;">Neteisingas vartotojo vardas arba slaptažodis.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">

    <div style="margin-bottom:12px;">
      <label for="{{ form.username.id_for_label }}">Vartotojas</label><br>
      {{ form.username }}
    </div>

    <div style="margin-bottom:16px;">
      <label for="{{ form.password.id_for_label }}">Slaptažodis</label><br>
      {{ form.password }}
    </div>

    <button type="submit" class="btn">Prisijungti</button>
  </form>
</div>
{% endblock %}
